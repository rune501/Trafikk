<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volda sentrum live</title>
<style>
body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:12px;max-width:50rem}
a{color:#f5a623}.back{font-size:13px;text-decoration:none}
h1{font-size:18px;margin:8px 0 12px}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#1e1e1e;border-radius:4px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.start{position:absolute;inset:0;width:100%;border:0;background:rgba(0,0,0,.55);color:#fff;font:600 18px system-ui,sans-serif;cursor:pointer}
.start[hidden]{display:none}
.t{color:#888;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<a class="back" href="./">‹ Meny</a>
<h1>Volda sentrum live</h1>
<div class="video">
  <iframe id="yt" title="Volda sentrum live (Voldahjarte)" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <button id="start" class="start" type="button" hidden>Trykk for å starte</button>
</div>
<p class="t">
  Direktesending fra YouTube-kanalen «Voldahjarte».
  Vises ikke bildet? <a id="yt-link" href="https://www.youtube.com/watch?v=n729eeBAU3E" target="_blank" rel="noopener">Åpne på YouTube</a>.
</p>
<script>
// Standard: en bestemt sending (video-ID).
var VIDEO_ID = 'n729eeBAU3E';
// Valgfritt: kanal-ID (starter med UC...) for alltid å vise kanalens pågående sending.
var CHANNEL_ID = '';
// 1 = vis YouTubes kontroller, 0 = skjul dem.
var CONTROLS = 1;

var base = 'https://www.youtube-nocookie.com/embed/';
var origin = location.protocol.indexOf('http') === 0 ? '&origin=' + encodeURIComponent(location.origin) : '';
var opts = '?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1&controls=' + CONTROLS + origin;
var src = CHANNEL_ID
  ? base + 'live_stream' + opts + '&channel=' + encodeURIComponent(CHANNEL_ID)
  : base + encodeURIComponent(VIDEO_ID) + opts;
document.getElementById('yt').src = src;
if (CHANNEL_ID) {
  document.getElementById('yt-link').href = 'https://www.youtube.com/channel/' + encodeURIComponent(CHANNEL_ID) + '/live';
}

var btn = document.getElementById('start');
var player, tries = 0, timer;
function tryPlay() {
  if (player && player.playVideo) { player.mute(); player.playVideo(); }
}
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('yt', { events: {
    onReady: function () {
      tryPlay();
      timer = setInterval(function () {
        if (++tries > 5) { clearInterval(timer); btn.hidden = false; return; }
        tryPlay();
      }, 2000);
    },
    onStateChange: function (e) {
      if (e.data === 1) { btn.hidden = true; clearInterval(timer); }
    },
    onAutoplayBlocked: function () { btn.hidden = false; }
  }});
};
btn.onclick = function () { tryPlay(); };
var s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);
</script>
</body>
</html>
