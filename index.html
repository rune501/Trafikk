<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#0d1a21;
  --surface:#15262f;
  --surface-hover:#1b3340;
  --line:#26414f;
  --text:#e8f0f3;
  --muted:#92a8b3;
  --accent:#f5a623;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  line-height:1.5;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
main{max-width:34rem;margin:0 auto}
h1{
  font-size:2rem;
  font-weight:700;
  letter-spacing:-.02em;
  margin:24px 0 4px;
}
.intro{color:var(--muted);margin:0 0 28px}
nav{display:flex;flex-direction:column;gap:10px}
nav a{
  display:block;
  padding:16px 18px;
  background:var(--surface);
  border:1px solid var(--line);
  border-left:5px solid var(--accent);
  border-radius:6px;
  color:inherit;
  text-decoration:none;
  transition:background .15s;
}
nav a:hover{background:var(--surface-hover)}
nav a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav strong{display:block;font-size:1.15rem;font-weight:650}
nav span{display:block;color:var(--muted);font-size:.92rem}
@media (prefers-reduced-motion:reduce){nav a{transition:none}}
</style>
</head>
<body>
<main>
  <nav>
    <a href="trafikkmeldinger.html">
      <strong>Trafikkmeldinger</strong>
      <span>Veiarbeid, stengte veier og hendelser fra Vegvesenet</span>
    </a>
    <a href="eiksundsambandet.html">
      <strong>Eiksundsambandet</strong>
      <span>Status for tunnelen og brua mellom Ørsta og Ulstein</span>
    </a>
    <a href="kamera.html">
      <strong>Kamera</strong>
      <span>Vegkamera langs veiene i området</span>
    </a>
    <a href="voldasentrum.html">
      <strong>Volda sentrum live</strong>
      <span>Direktesending fra kameraet i sentrum</span>
    </a>
  </nav>
</main>
</body>
</html>
